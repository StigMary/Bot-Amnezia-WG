name: CI

on:
  push:
    branches: [main, develop, v2.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (errors only)
        run: ruff check . --select F821,E9 --output-format=github

      - name: Run ruff format (check only)
        run: ruff format --check . || true

  syntax:
    name: Syntax & imports (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all .py files
        run: python -m compileall -q .

      - name: Import smoke test
        env:
          BOT_TOKEN: "123:dummy_bot_token"
          ADMIN_ID: "1"
          ADMIN_API_KEY: "ci_test_key_ci_test_key_ci_test_key"
          NODE_1: "Node|local|22|root|amnezia-awg|awg0"
        run: |
          python -c "import webapp.main; print('Import OK')"

      - name: Run pytest security suite
        env:
          BOT_TOKEN: "123:dummy_bot_token"
          ADMIN_ID: "1"
          ADMIN_API_KEY: "ci_test_key_ci_test_key_ci_test_key"
          NODE_1: "Node|local|22|root|amnezia-awg|awg0"
        run: |
          pip install pytest httpx
          pytest -v

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tools
        run: pip install bandit pip-audit

      - name: Bandit (SAST - High only)
        run: bandit -r . -x ./tests,./.venv -lll

      - name: pip-audit (vulnerabilities)
        run: pip-audit -r requirements.txt || true
