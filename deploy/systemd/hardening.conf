# Drop-in для усиления безопасности и анти-флаппинга vpn-bot.service.
#
# Установка:
#   sudo mkdir -p /etc/systemd/system/vpn-bot.service.d
#   sudo cp deploy/systemd/hardening.conf /etc/systemd/system/vpn-bot.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart vpn-bot.service

[Unit]
StartLimitBurst=5
StartLimitIntervalSec=300
# Алерт в Telegram при падении сервиса (см. deploy/systemd/alert@.service)
OnFailure=alert@%n.service

[Service]
# Лимит памяти - убьёт процесс при утечке вместо OOM всей системы
MemoryMax=200M
MemoryHigh=150M

Restart=always
RestartSec=5

# Sandboxing
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/home/vpnuser/vpn_bot /home/vpnuser/backup.log /tmp /var/tmp
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
LockPersonality=true
